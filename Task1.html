<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Tasks</title>
</head>
<body>
    <h1>JavaScript Beginner Tasks</h1>

    <script>
        // Task 1: Variable Practice
        let studentName = "Jeromariaraj";
        let studentAge = 22;
        let studentCourse = "BCA";

        console.log("Task 1");
        console.log(studentName);
        console.log(studentAge);
        console.log(studentCourse);

        // Task 2: Var, Let, Const
        var company = "Stackly";
        let salary = 20000;
        const country = "India";

        company = "Google";
        salary = 30000;

        console.log("Task 2");
        console.log("Company:", company);
        console.log("Salary:", salary);
        console.log("Country:", country);

        // Task 3: User Name
        let userName = prompt("Task 3: What is your name?");
        console.log("Welcome " + userName);

        // Task 4: Confirm Box
        let knowsJS = confirm("Task 4: Do you know JavaScript?");
        console.log("Knows JavaScript:", knowsJS);

        // Task 5: Student Information
        let sName = prompt("Task 5: Enter Student Name");
        let sAge = prompt("Task 5: Enter Student Age");
        let sCity = prompt("Task 5: Enter Student City");

        console.log("Name :", sName);
        console.log("Age :", sAge);
        console.log("City :", sCity);

        // Task 6: Alert Message
        let course = "JavaScript";
        alert("Welcome to " + course);

        // Task 7: Document Write
        document.writeln("<h2>Task 7 Output</h2>");
        document.writeln("Hello Student <br>");
        document.writeln("Welcome to JavaScript <br><br>");

        // Task 8: Favorite Things
        let favoriteFood = "Chicken Biryani";
        let favoriteColor = "Black";
        let favoriteMovie = "Leo";

        console.log("Food :", favoriteFood);
        console.log("Color :", favoriteColor);
        console.log("Movie :", favoriteMovie);

        // Task 9: Mini Bio Data
        let bioName = "Jeromariaraj";
        let bioAge = 22;
        let phone = "9876543210";
        let email = "jeromariaraj@example.com";

        console.log("Name :", bioName);
        console.log("Age :", bioAge);
        console.log("Phone :", phone);
        console.log("Email :", email);

        // Task 10: Challenge
        let challengeName = prompt("Task 10: Enter Your Name");
        let challengeCourse = prompt("Task 10: Enter Your Course");

        alert("Hello " + challengeName + ", Welcome to " + challengeCourse + " Course");
    </script>
</body>
</html>
